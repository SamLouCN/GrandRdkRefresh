server {
    listen 80 default_server;
    server_name _;

    # 前端静态页面根目录（改成你板上的真实路径）
    root /home/sunrise/GrandRdkRefresh/web;
    index index.html;

    # 静态页面
    location / {
        try_files $uri $uri/ /index.html;
    }

    # MJPEG 流（关键：关闭缓冲）
    location /cam1 {
        proxy_pass http://127.0.0.1:5000/cam1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /cam2 {
        proxy_pass http://127.0.0.1:5000/cam2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:5000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}